services:
  ros_dev:
    container_name: ${CONTAINER_NAME}
    build:
      context: .
      args:
        SOURCE_IMAGE: ${SOURCE_IMAGE}
        USER_NAME: ${USER_NAME}
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
        USER_HOME: ${USER_HOME}
        PROJECT_NAME: ${PROJECT_NAME}
    image: ${LOCAL_IMAGE_NAME}:${LOCAL_IMAGE_TAG}
    working_dir: ${WORKSPACE_DIR}
    privileged: true
    network_mode: host
    pid: host
    # GLFW/MuJoCo uses X11 MIT-SHM for the on-screen renderer. The X server
    # runs on the host, so the container must share the host IPC namespace.
    ipc: host
    volumes:
      - "${DOCKER_XAUTHORITY}:/tmp/.docker.xauth:ro"
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      - "/home/${USER_NAME}/.ssh:/home/${USER_NAME}/.ssh"
      - "/home/${USER_NAME}/.gitconfig:/home/${USER_NAME}/.gitconfig"
      - "/etc/localtime:/etc/localtime"
      - "/var/cache/ccache:/var/cache/ccache"
      - "/tmp/:/tmp/"
      - "/dev/snd:/dev/snd"
      - "/dev/shm:/dev/shm"
      - "/dev/bus/usb:/dev/bus/usb"
      - "/etc/machine-id:/etc/machine-id"
      - "/var/lib/dbus:/var/lib/dbus"
      - "${WORKSPACE_DIR}:${WORKSPACE_DIR}"
      - "/dev:/dev"
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/.docker.xauth
      # The host uses an Arrow Lake GPU that the Jammy Mesa stack in the
      # image does not recognize. Keep MuJoCo's GLFW window on llvmpipe.
      - LIBGL_ALWAYS_SOFTWARE=1
      - MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
      - LIBGL_DRI3_DISABLE=1
      - GALLIUM_DRIVER=llvmpipe
      - QT_X11_NO_MITSHM=1
      - XMODIFIERS=${XMODIFIERS}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - QT_IM_MODULE=${QT_IM_MODULE}
      - GTK_IM_MODULE=${GTK_IM_MODULE}
      - NVIDIA_DRIVER_CAPABILITIES=all
    extra_hosts:
      - "${HOSTNAME}:127.0.0.1"
