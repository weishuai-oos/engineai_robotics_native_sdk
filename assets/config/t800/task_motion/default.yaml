# ----------------------- Motion Tasks ----------------------- #
#
# The SDK core task parser has no symbolic LT key. The input adapters encode a
# pressed LT as the impossible simultaneous CROSS_Y_LEFT+CROSS_Y_RIGHT marker,
# so [CROSS_Y_LEFT, CROSS_Y_RIGHT, A/X/Y] below means physical LT + A/X/Y.
# LB + BACK remains the real getup2 combination.

cpu:
  number: 3
  priority: 10

tasks:
  - motion: idle
    period: 0.002
    runner:
      - name: idle_runner
        enabled: true
    manual_transition:
      - passive
    auto_transition: passive
    key: [BACK, START]

  - motion: passive
    period: 0.002
    runner:
      - name: passive_runner
        enabled: true
    manual_transition:
      - idle
      - pd_stand
      - pd_stand_x
      - pd_stand_y
      - supine_to_stance
      - getup
      - getup2
    key: [LB, RB]

  - motion: pd_stand
    period: 0.002
    runner:
      - name: pd_stand_runner
        enabled: true
        param_tag: pd_stand
    manual_transition:
      - passive
      - walk
      - walk_custom
      - walk_leo
      - walk_leo_terrain
      - dance
      - victory
      - rl_left_front_kick_002_complete_heightfall
      - rl_roundhouse_kick
      - rl_straight_punch_L_improved
      - rl_left_hook_001_improved
      - supine_to_stance
      - getup
      - getup2
      - pd_stand_x
      - pd_stand_y
    key: [CROSS_Y_LEFT, CROSS_Y_RIGHT, A]  # physical LT + A

  - motion: pd_stand_x
    period: 0.002
    runner:
      - name: pd_stand_runner
        enabled: true
        param_tag: pd_stand_x
    manual_transition:
      - passive
      - pd_stand
      - pd_stand_y
      - walk
      - walk_custom
      - walk_leo
      - walk_leo_terrain
      - dance
      - victory
      - rl_left_front_kick_002_complete_heightfall
      - rl_roundhouse_kick
      - rl_straight_punch_L_improved
      - rl_left_hook_001_improved
      - supine_to_stance
      - getup
      - getup2
    key: [CROSS_Y_LEFT, CROSS_Y_RIGHT, X]  # physical LT + X

  - motion: pd_stand_y
    period: 0.002
    runner:
      - name: pd_stand_runner
        enabled: true
        param_tag: pd_stand_y
    manual_transition:
      - passive
      - pd_stand
      - pd_stand_x
      - walk
      - walk_custom
      - walk_leo
      - walk_leo_terrain
      - dance
      - victory
      - rl_left_front_kick_002_complete_heightfall
      - rl_roundhouse_kick
      - rl_straight_punch_L_improved
      - rl_left_hook_001_improved
      - supine_to_stance
      - getup
      - getup2
    key: [CROSS_Y_LEFT, CROSS_Y_RIGHT, Y]  # physical LT + Y

  - motion: walk
    period: 0.01
    runner:
      - name: rl_walking_example_runner
        enabled: true
        param_tag: rl_walking_example
    manual_transition:
      - passive
      - pd_stand
      - walk_custom
      - walk_leo
      - walk_leo_terrain
      - getup
      - getup2
      - stance_to_supine
      - dance
      - victory
      - rl_left_front_kick_002_complete_heightfall
      - rl_roundhouse_kick
      - rl_straight_punch_L_improved
      - rl_left_hook_001_improved
    key: [LB, B]

  - motion: walk_custom
    period: 0.01
    runner:
      - name: rl_walking_custom_example_runner
        enabled: true
        param_tag: rl_walking_custom_example
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_leo
      - walk_leo_terrain
      - getup
      - getup2
      - stance_to_supine
      - dance
      - victory
      - rl_left_front_kick_002_complete_heightfall
      - rl_roundhouse_kick
      - rl_straight_punch_L_improved
      - rl_left_hook_001_improved
    key: [LB, Y]

  - motion: walk_leo
    period: 0.02
    runner:
      - name: rl_walking_leolab_example_runner
        enabled: true
        param_tag: rl_walking_leolab_example
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_custom
      - walk_leo_terrain
      - getup
      - getup2
      - stance_to_supine
      - dance
      - victory
      - rl_left_front_kick_002_complete_heightfall
      - rl_roundhouse_kick
      - rl_straight_punch_L_improved
      - rl_left_hook_001_improved
    key: [LB, A]

  - motion: walk_leo_terrain
    period: 0.02
    runner:
      - name: rl_walking_leolab_example_runner
        enabled: true
        param_tag: rl_walking_leolab_terrain_example
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_custom
      - walk_leo
      - getup
      - getup2
      - stance_to_supine
      - dance
      - victory
      - rl_left_front_kick_002_complete_heightfall
      - rl_roundhouse_kick
      - rl_straight_punch_L_improved
      - rl_left_hook_001_improved
    key: [LB, X]

  - motion: dance
    period: 0.02
    runner:
      - name: rl_dance_example_runner
        enabled: true
        param_tag: rl_dance_example
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_custom
      - walk_leo
      - walk_leo_terrain
    auto_transition: walk_leo
    key: [RB, B]

  - motion: victory
    period: 0.02
    runner:
      - name: rl_dance_example_runner
        enabled: true
        param_tag: rl_victory_example
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_custom
      - walk_leo
      - walk_leo_terrain
    auto_transition: walk_leo
    key: [RB, Y]

  - motion: rl_left_front_kick_002_complete_heightfall
    period: 0.02
    runner:
      - name: rl_dance_example_runner
        enabled: true
        param_tag: rl_left_front_kick_002_complete_heightfall
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_custom
      - walk_leo
      - walk_leo_terrain
    auto_transition: walk_leo
    key: [RB, CROSS_X_UP]

  - motion: rl_roundhouse_kick
    period: 0.02
    runner:
      - name: rl_dance_example_runner
        enabled: true
        param_tag: rl_roundhouse_kick
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_custom
      - walk_leo
      - walk_leo_terrain
    auto_transition: walk_leo
    key: [RB, CROSS_X_DOWN]

  - motion: rl_straight_punch_L_improved
    period: 0.02
    runner:
      - name: rl_dance_example_runner
        enabled: true
        param_tag: rl_straight_punch_L_improved
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_custom
      - walk_leo
      - walk_leo_terrain
    auto_transition: walk_leo
    key: [RB, CROSS_Y_LEFT]

  - motion: rl_left_hook_001_improved
    period: 0.02
    runner:
      - name: rl_dance_example_runner
        enabled: true
        param_tag: rl_left_hook_001_improved
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_custom
      - walk_leo
      - walk_leo_terrain
    auto_transition: walk_leo
    key: [RB, CROSS_Y_RIGHT]

  - motion: supine_to_stance
    period: 0.01
    runner:
      - name: rl_mimic_trajectory_runner
        enabled: true
        param_tag: rl_supine_to_stance
    manual_transition:
      - passive
      - pd_stand
    auto_transition: walk_leo
    key: [START, CROSS_X_UP]

  - motion: getup
    period: 0.02
    runner:
      - name: rl_getup_example_runner
        enabled: true
        param_tag: rl_getup_example
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_custom
      - walk_leo
      - walk_leo_terrain
    auto_transition: walk_leo
    key: [LB, START]

  - motion: getup2
    period: 0.02
    runner:
      - name: rl_getup_example_runner
        enabled: true
        param_tag: rl_getup2_example
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_custom
      - walk_leo
      - walk_leo_terrain
    auto_transition: walk_leo
    key: [LB, BACK]

  - motion: stance_to_supine
    period: 0.01
    runner:
      - name: rl_mimic_trajectory_runner
        enabled: true
        param_tag: rl_stance_to_supine
    manual_transition:
      - passive
      - pd_stand
    auto_transition: passive
    key: [START, CROSS_X_DOWN]
