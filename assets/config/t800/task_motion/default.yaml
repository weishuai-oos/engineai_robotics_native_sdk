    period: 0.02
    runner:
      - name: rl_supermimic_runner
        enabled: true
        param_tag: rl_supermimic_action_11
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_leo
    auto_transition: walk_leo
    key: [RB, CROSS_Y_LEFT]

  # Source virtual action 13: 左抖拳（中）, 32000 iterations; RB+右
  - motion: supermimic_action_13
    period: 0.02
    runner:
      - name: rl_supermimic_runner
        enabled: true
        param_tag: rl_supermimic_action_13
    manual_transition:
      - passive
