    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_impact
      - walk_leo
      - walk_leo_terrain
    auto_transition: walk_leo
    key: [LB, CROSS_Y_LEFT]

  # Source virtual action 11: 左手下拉捅锤, 18000 iterations; LB+右
  - motion: supermimic_action_11
    period: 0.02
    runner:
      - name: rl_supermimic_runner
        enabled: true
        param_tag: rl_supermimic_action_11
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_impact
      - walk_leo
      - walk_leo_terrain
    auto_transition: walk_leo
    key: [LB, CROSS_Y_RIGHT]

  # Source virtual action 12: 左抖拳（低）, 32000 iterations; RB+上
  - motion: supermimic_action_12
    period: 0.02
    runner:
      - name: rl_supermimic_runner
        enabled: true
        param_tag: rl_supermimic_action_12
