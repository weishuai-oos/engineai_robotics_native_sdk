# ----------------------- Motion Tasks ----------------------- #
#
# The SDK core task parser has no symbolic LT/RT keys. The input adapters encode
# pressed LT as the impossible simultaneous CROSS_Y_LEFT+CROSS_Y_RIGHT marker
# and pressed RT as CROSS_X_UP+CROSS_X_DOWN. The marker pairs below therefore
# represent physical trigger + key combinations.
# RT + d-pad up/down share the RT marker and are intentionally unassigned.
# LB + BACK is intentionally left unassigned after the HoST key remap.

cpu:
  number: 3
  priority: 10

tasks:
  - motion: idle
    period: 0.002
    runner:
      - name: idle_runner
        enabled: true
    manual_transition:
      - passive
    auto_transition: passive
    key: [BACK, START]

  - motion: passive
    period: 0.002
    runner:
      - name: passive_runner
        enabled: true
    manual_transition:
      - idle
      - pd_stand
      - pd_stand_x
      - pd_stand_y
      - supine_to_stance
      - prone_to_stance
      - getup
      - getup2
    key: [LB, RB]

  - motion: pd_stand
    period: 0.002
    runner:
      - name: pd_stand_runner
        enabled: true
        param_tag: pd_stand
    manual_transition:
      - passive
      - walk
      - walk_leo
      - supermimic_action_06
      - supermimic_action_09
      - supermimic_action_11
      - supermimic_action_13
      - supermimic_action_14
      - supermimic_action_15
      - supermimic_action_16
      - supermimic_action_17
      - supermimic_action_19
      - supermimic_action_20
      - supine_to_stance
      - prone_to_stance
      - getup
      - getup2
      - pd_stand_x
      - pd_stand_y
      - walk_v2_dr_194500
      - walk_v2_dr_191500
      - walk_plus_origin_180000
      - walk_plus_dr_189000
    key: [CROSS_Y_LEFT, CROSS_Y_RIGHT, A]  # physical LT + A

  - motion: pd_stand_x
    period: 0.002
    runner:
      - name: pd_stand_runner
        enabled: true
        param_tag: pd_stand_x
    manual_transition:
      - passive
      - pd_stand
      - pd_stand_y
      - walk
      - walk_leo
      - supermimic_action_06
      - supermimic_action_09
      - supermimic_action_11
      - supermimic_action_13
      - supermimic_action_14
      - supermimic_action_15
      - supermimic_action_16
      - supermimic_action_17
      - supermimic_action_19
      - supermimic_action_20
      - supine_to_stance
      - prone_to_stance
      - getup
      - getup2
      - walk_v2_dr_194500
      - walk_v2_dr_191500
      - walk_plus_origin_180000
      - walk_plus_dr_189000
    key: [CROSS_Y_LEFT, CROSS_Y_RIGHT, X]  # physical LT + X

  - motion: pd_stand_y
    period: 0.002
    runner:
      - name: pd_stand_runner
        enabled: true
        param_tag: pd_stand_y
    manual_transition:
      - passive
      - pd_stand
      - pd_stand_x
      - walk
      - walk_leo
      - supermimic_action_06
      - supermimic_action_09
      - supermimic_action_11
      - supermimic_action_13
      - supermimic_action_14
      - supermimic_action_15
      - supermimic_action_16
      - supermimic_action_17
      - supermimic_action_19
      - supermimic_action_20
      - supine_to_stance
      - prone_to_stance
      - getup
      - getup2
      - walk_v2_dr_194500
      - walk_v2_dr_191500
      - walk_plus_origin_180000
      - walk_plus_dr_189000
    key: [CROSS_Y_LEFT, CROSS_Y_RIGHT, Y]  # physical LT + Y

  - motion: walk
    period: 0.01
    runner:
      - name: rl_walking_example_runner
        enabled: true
        param_tag: rl_walking_example
    manual_transition:
      - passive
      - pd_stand
      - walk_leo
      - getup
      - getup2
      - stance_to_supine
      - supermimic_action_06
      - supermimic_action_09
      - supermimic_action_11
      - supermimic_action_13
      - supermimic_action_14
      - supermimic_action_15
      - supermimic_action_16
      - supermimic_action_17
      - supermimic_action_19
      - supermimic_action_20
      - walk_v2_dr_194500
      - walk_v2_dr_191500
      - walk_plus_origin_180000
      - walk_plus_dr_189000
    key: [LB, B]

  - motion: walk_leo
    period: 0.02
    runner:
      - name: rl_walking_leolab_example_runner
        enabled: true
        param_tag: rl_walking_leolab_example
    manual_transition:
      - passive
      - pd_stand
      - walk
      - leo_taunt
      - getup
      - getup2
      - stance_to_supine
      - supermimic_action_06
      - supermimic_action_09
      - supermimic_action_11
      - supermimic_action_13
      - supermimic_action_14
      - supermimic_action_15
      - supermimic_action_16
      - supermimic_action_17
      - supermimic_action_19
      - supermimic_action_20
      - walk_v2_dr_194500
      - walk_v2_dr_191500
      - walk_plus_origin_180000
      - walk_plus_dr_189000
    key: [LB, A]

  - motion: leo_taunt
    period: 0.02
    runner:
      - name: rl_walking_leolab_example_runner
        enabled: true
        param_tag: rl_walking_leolab_taunt
    # This action is intentionally reachable only from the standard Leo gait.
    manual_transition:
      - walk_leo
    auto_transition: walk_leo
    # Physical LB + Y. The old ImpactV2 gait no longer owns this key.
    key: [LB, Y]

  - motion: walk_v2_dr_194500
    period: 0.02
    runner:
      - name: rl_walking_leolab_example_runner
        enabled: true
        param_tag: rl_walking_leolab_impact_v2_dr_194500
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_leo
      - walk_v2_dr_191500
      - walk_plus_origin_180000
      - walk_plus_dr_189000
      - getup
      - getup2
      - stance_to_supine
      - supermimic_action_06
      - supermimic_action_09
      - supermimic_action_11
      - supermimic_action_13
      - supermimic_action_14
      - supermimic_action_15
      - supermimic_action_16
      - supermimic_action_17
      - supermimic_action_19
      - supermimic_action_20
    # ImpactV2 DR 194500, physical LB + d-pad up.
    key: [LB, CROSS_X_UP]

  - motion: walk_v2_dr_191500
    period: 0.02
    runner:
      - name: rl_walking_leolab_example_runner
        enabled: true
        param_tag: rl_walking_leolab_impact_v2_dr_191500
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_leo
      - walk_v2_dr_194500
      - walk_plus_origin_180000
      - walk_plus_dr_189000
      - getup
      - getup2
      - stance_to_supine
      - supermimic_action_06
      - supermimic_action_09
      - supermimic_action_11
      - supermimic_action_13
      - supermimic_action_14
      - supermimic_action_15
      - supermimic_action_16
      - supermimic_action_17
      - supermimic_action_19
      - supermimic_action_20
    # ImpactV2 DR 191500, physical LB + d-pad right.
    key: [LB, CROSS_Y_RIGHT]

  - motion: walk_plus_origin_180000
    period: 0.02
    runner:
      - name: rl_walking_leolab_example_runner
        enabled: true
        param_tag: rl_walking_leolab_impact_v2_plus_origin_180000
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_leo
      - walk_v2_dr_194500
      - walk_v2_dr_191500
      - walk_plus_dr_189000
      - getup
      - getup2
      - stance_to_supine
      - supermimic_action_06
      - supermimic_action_09
      - supermimic_action_11
      - supermimic_action_13
      - supermimic_action_14
      - supermimic_action_15
      - supermimic_action_16
      - supermimic_action_17
      - supermimic_action_19
      - supermimic_action_20
    # Dedicated four-way walking strategy; physical LB + d-pad down.
    key: [LB, CROSS_X_DOWN]

  - motion: walk_plus_dr_189000
    period: 0.02
    runner:
      - name: rl_walking_leolab_example_runner
        enabled: true
        param_tag: rl_walking_leolab_impact_v2_plus_dr_189000
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_leo
      - walk_v2_dr_194500
      - walk_v2_dr_191500
      - walk_plus_origin_180000
      - getup
      - getup2
      - stance_to_supine
      - supermimic_action_06
      - supermimic_action_09
      - supermimic_action_11
      - supermimic_action_13
      - supermimic_action_14
      - supermimic_action_15
      - supermimic_action_16
      - supermimic_action_17
      - supermimic_action_19
      - supermimic_action_20
    # Dedicated four-way walking strategy; physical LB + d-pad left.
    key: [LB, CROSS_Y_LEFT]

  - motion: supermimic_action_06
    period: 0.02
    runner:
      - name: rl_supermimic_runner
        enabled: true
        param_tag: rl_supermimic_action_06
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_leo
    auto_transition: walk_leo
    key: [RB, CROSS_X_UP]

  # Source virtual action 09: 左勾拳, 20000 iterations; RB+下
  - motion: supermimic_action_09
    period: 0.02
    runner:
      - name: rl_supermimic_runner
        enabled: true
