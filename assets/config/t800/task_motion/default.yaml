# ----------------------- Motion Tasks ----------------------- #
#
# The SDK core task parser has no symbolic LT/RT keys. The input adapters encode
# pressed LT as the impossible simultaneous CROSS_Y_LEFT+CROSS_Y_RIGHT marker
# and pressed RT as CROSS_X_UP+CROSS_X_DOWN. The marker pairs below therefore
# represent physical trigger + key combinations.
# RT + d-pad up/down share the RT marker and are intentionally unassigned.
# LB + BACK remains the real getup2 combination.

cpu:
  number: 3
  priority: 10

tasks:
  - motion: idle
    period: 0.002
    runner:
      - name: idle_runner
        enabled: true
    manual_transition:
      - passive
    auto_transition: passive
    key: [BACK, START]

  - motion: passive
    period: 0.002
    runner:
      - name: passive_runner
        enabled: true
    manual_transition:
      - idle
      - pd_stand
      - pd_stand_x
      - pd_stand_y
      - supine_to_stance
      - prone_to_stance
      - getup
      - getup2
    key: [LB, RB]

  - motion: pd_stand
    period: 0.002
    runner:
      - name: pd_stand_runner
        enabled: true
        param_tag: pd_stand
    manual_transition:
      - passive
      - walk
      - walk_impact
      - walk_leo
      - walk_leo_terrain
      - supermimic_action_06
      - supermimic_action_08
      - supermimic_action_09
      - supermimic_action_11
      - supermimic_action_12
      - supermimic_action_13
      - supermimic_action_14
      - supermimic_action_15
      - supermimic_action_16
      - supermimic_action_17
      - supermimic_action_18
      - supermimic_action_19
      - supermimic_action_20
      - supine_to_stance
      - prone_to_stance
      - getup
      - getup2
      - pd_stand_x
      - pd_stand_y
    key: [CROSS_Y_LEFT, CROSS_Y_RIGHT, A]  # physical LT + A

  - motion: pd_stand_x
    period: 0.002
    runner:
      - name: pd_stand_runner
        enabled: true
        param_tag: pd_stand_x
    manual_transition:
      - passive
      - pd_stand
      - pd_stand_y
      - walk
      - walk_impact
      - walk_leo
      - walk_leo_terrain
      - supermimic_action_06
      - supermimic_action_08
      - supermimic_action_09
      - supermimic_action_11
      - supermimic_action_12
      - supermimic_action_13
      - supermimic_action_14
      - supermimic_action_15
      - supermimic_action_16
      - supermimic_action_17
      - supermimic_action_18
      - supermimic_action_19
      - supermimic_action_20
      - supine_to_stance
      - prone_to_stance
      - getup
      - getup2
    key: [CROSS_Y_LEFT, CROSS_Y_RIGHT, X]  # physical LT + X

  - motion: pd_stand_y
    period: 0.002
    runner:
      - name: pd_stand_runner
        enabled: true
        param_tag: pd_stand_y
    manual_transition:
      - passive
      - pd_stand
      - pd_stand_x
      - walk
      - walk_impact
      - walk_leo
      - walk_leo_terrain
      - supermimic_action_06
      - supermimic_action_08
      - supermimic_action_09
      - supermimic_action_11
      - supermimic_action_12
      - supermimic_action_13
      - supermimic_action_14
      - supermimic_action_15
      - supermimic_action_16
      - supermimic_action_17
      - supermimic_action_18
      - supermimic_action_19
      - supermimic_action_20
      - supine_to_stance
      - prone_to_stance
      - getup
      - getup2
    key: [CROSS_Y_LEFT, CROSS_Y_RIGHT, Y]  # physical LT + Y

  - motion: walk
    period: 0.01
    runner:
      - name: rl_walking_example_runner
        enabled: true
        param_tag: rl_walking_example
    manual_transition:
      - passive
      - pd_stand
      - walk_impact
      - walk_leo
      - walk_leo_terrain
      - getup
      - getup2
      - stance_to_supine
      - supermimic_action_06
      - supermimic_action_08
      - supermimic_action_09
      - supermimic_action_11
      - supermimic_action_12
      - supermimic_action_13
      - supermimic_action_14
      - supermimic_action_15
      - supermimic_action_16
      - supermimic_action_17
      - supermimic_action_18
      - supermimic_action_19
      - supermimic_action_20
    key: [LB, B]

  - motion: walk_impact
    period: 0.02
    runner:
      - name: rl_walking_leolab_example_runner
        enabled: true
        param_tag: rl_walking_leolab_impact_v2
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_leo
      - walk_leo_terrain
      - getup
      - getup2
      - stance_to_supine
      - supermimic_action_06
      - supermimic_action_08
      - supermimic_action_09
      - supermimic_action_11
      - supermimic_action_12
      - supermimic_action_13
      - supermimic_action_14
      - supermimic_action_15
      - supermimic_action_16
      - supermimic_action_17
      - supermimic_action_18
      - supermimic_action_19
      - supermimic_action_20
    key: [LB, Y]

  - motion: walk_leo
    period: 0.02
    runner:
      - name: rl_walking_leolab_example_runner
        enabled: true
        param_tag: rl_walking_leolab_example
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_impact
      - walk_leo_terrain
      - leo_taunt
      - getup
      - getup2
      - stance_to_supine
      - supermimic_action_06
      - supermimic_action_08
      - supermimic_action_09
      - supermimic_action_11
      - supermimic_action_12
      - supermimic_action_13
      - supermimic_action_14
      - supermimic_action_15
      - supermimic_action_16
      - supermimic_action_17
      - supermimic_action_18
      - supermimic_action_19
      - supermimic_action_20
    key: [LB, A]

  - motion: leo_taunt
    period: 0.02
    runner:
      - name: rl_walking_leolab_example_runner
        enabled: true
        param_tag: rl_walking_leolab_taunt
    # This action is intentionally reachable only from the standard Leo gait.
    manual_transition:
      - walk_leo
    auto_transition: walk_leo
    # Physical LT+B; the paired d-pad entries are the virtual-remote LT marker.
    key: [CROSS_Y_LEFT, CROSS_Y_RIGHT, B]

  - motion: walk_leo_terrain
    period: 0.02
    runner:
      - name: rl_walking_leolab_example_runner
        enabled: true
        param_tag: rl_walking_leolab_terrain_example
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_impact
      - walk_leo
      - getup
      - getup2
      - stance_to_supine
      - supermimic_action_06
      - supermimic_action_08
      - supermimic_action_09
      - supermimic_action_11
      - supermimic_action_12
      - supermimic_action_13
      - supermimic_action_14
      - supermimic_action_15
      - supermimic_action_16
      - supermimic_action_17
      - supermimic_action_18
      - supermimic_action_19
      - supermimic_action_20
    key: [LB, X]

  # Source virtual action 06: 左抖拳（高）, 32000 iterations; LB+上
  - motion: supermimic_action_06
    period: 0.02
    runner:
      - name: rl_supermimic_runner
        enabled: true
        param_tag: rl_supermimic_action_06
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_impact
      - walk_leo
      - walk_leo_terrain
    auto_transition: walk_leo
    key: [LB, CROSS_X_UP]

  # Source virtual action 08: 左勾拳, 32000 iterations; LB+下
  - motion: supermimic_action_08
    period: 0.02
    runner:
      - name: rl_supermimic_runner
        enabled: true
        param_tag: rl_supermimic_action_08
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_impact
      - walk_leo
      - walk_leo_terrain
    auto_transition: walk_leo
    key: [LB, CROSS_X_DOWN]

  # Source virtual action 09: 左勾拳, 20000 iterations; LB+左
  - motion: supermimic_action_09
    period: 0.02
    runner:
      - name: rl_supermimic_runner
        enabled: true
