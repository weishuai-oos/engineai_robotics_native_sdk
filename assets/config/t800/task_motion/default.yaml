# ----------------------- Motion Tasks ----------------------- #
#
# The SDK core task parser has no symbolic LT/RT keys. The input adapters encode
# pressed LT as the impossible simultaneous CROSS_Y_LEFT+CROSS_Y_RIGHT marker
# and pressed RT as CROSS_X_UP+CROSS_X_DOWN. The marker pairs below therefore
# represent physical trigger + key combinations.
# RT + d-pad up/down share the RT marker and are intentionally unassigned.
# LB + BACK remains the real getup2 combination.

cpu:
  number: 3
  priority: 10

tasks:
  - motion: idle
    period: 0.002
    runner:
      - name: idle_runner
        enabled: true
    manual_transition:
      - passive
    auto_transition: passive
    key: [BACK, START]

  - motion: passive
    period: 0.002
    runner:
      - name: passive_runner
        enabled: true
    manual_transition:
      - idle
      - pd_stand
      - pd_stand_x
      - pd_stand_y
      - supine_to_stance
      - prone_to_stance
      - getup
      - getup2
    key: [LB, RB]

  - motion: pd_stand
    period: 0.002
    runner:
      - name: pd_stand_runner
        enabled: true
        param_tag: pd_stand
    manual_transition:
      - passive
      - walk
      - walk_impact
      - walk_leo
      - walk_leo_terrain
      - supermimic_action_01
      - supermimic_action_02
      - supermimic_action_03
      - supermimic_action_04
      - supermimic_action_05
      - supermimic_action_06
      - supermimic_action_07
      - supermimic_action_08
      - supermimic_action_09
      - supermimic_action_10
      - supermimic_action_11
      - supermimic_action_12
      - supermimic_action_14
      - supermimic_action_15
      - supermimic_action_16
      - supine_to_stance
      - prone_to_stance
      - getup
      - getup2
      - pd_stand_x
      - pd_stand_y
    key: [CROSS_Y_LEFT, CROSS_Y_RIGHT, A]  # physical LT + A

  - motion: pd_stand_x
    period: 0.002
    runner:
      - name: pd_stand_runner
        enabled: true
        param_tag: pd_stand_x
    manual_transition:
      - passive
      - pd_stand
      - pd_stand_y
      - walk
      - walk_impact
      - walk_leo
      - walk_leo_terrain
      - supermimic_action_01
      - supermimic_action_02
      - supermimic_action_03
      - supermimic_action_04
      - supermimic_action_05
      - supermimic_action_06
      - supermimic_action_07
      - supermimic_action_08
      - supermimic_action_09
      - supermimic_action_10
      - supermimic_action_11
      - supermimic_action_12
      - supermimic_action_14
      - supermimic_action_15
      - supermimic_action_16
      - supine_to_stance
      - prone_to_stance
      - getup
      - getup2
    key: [CROSS_Y_LEFT, CROSS_Y_RIGHT, X]  # physical LT + X

  - motion: pd_stand_y
    period: 0.002
    runner:
      - name: pd_stand_runner
        enabled: true
        param_tag: pd_stand_y
    manual_transition:
      - passive
      - pd_stand
      - pd_stand_x
      - walk
      - walk_impact
      - walk_leo
      - walk_leo_terrain
      - supermimic_action_01
      - supermimic_action_02
      - supermimic_action_03
      - supermimic_action_04
      - supermimic_action_05
      - supermimic_action_06
      - supermimic_action_07
      - supermimic_action_08
      - supermimic_action_09
      - supermimic_action_10
      - supermimic_action_11
      - supermimic_action_12
      - supermimic_action_14
      - supermimic_action_15
      - supermimic_action_16
      - supine_to_stance
      - prone_to_stance
      - getup
      - getup2
    key: [CROSS_Y_LEFT, CROSS_Y_RIGHT, Y]  # physical LT + Y

  - motion: walk
    period: 0.01
