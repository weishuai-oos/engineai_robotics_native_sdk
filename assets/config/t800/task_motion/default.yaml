  # Source virtual action 14: 左正蹬, 18000 iterations; RB+B
  - motion: supermimic_action_14
    period: 0.02
    runner:
      - name: rl_supermimic_runner
        enabled: true
        param_tag: rl_supermimic_action_14
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_leo
    auto_transition: walk_leo
    key: [RB, B]

  # Source virtual action 15: 前腿侧踩, 18000 iterations; RB+A
  - motion: supermimic_action_15
    period: 0.02
    runner:
      - name: rl_supermimic_runner
        enabled: true
        param_tag: rl_supermimic_action_15
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_leo
    auto_transition: walk_leo
    key: [RB, A]

  # Source virtual action 16: 左低弹踢, 26000 iterations; RT+左
  - motion: supermimic_action_16
    period: 0.02
    runner:
      - name: rl_supermimic_runner
        enabled: true
        param_tag: rl_supermimic_action_16
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_leo
    auto_transition: walk_leo
    key: [CROSS_X_UP, CROSS_X_DOWN, CROSS_Y_LEFT]

  # Source virtual action 17: 左高弹踢, 18000 iterations; RT+右
  - motion: supermimic_action_17
    period: 0.02
    runner:
      - name: rl_supermimic_runner
        enabled: true
        param_tag: rl_supermimic_action_17
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_leo
    auto_transition: walk_leo
    key: [CROSS_X_UP, CROSS_X_DOWN, CROSS_Y_RIGHT]

  # Source virtual action 19: 左低鞭, 18000 iterations; RB+Y
  - motion: supermimic_action_19
    period: 0.02
    runner:
      - name: rl_supermimic_runner
        enabled: true
        param_tag: rl_supermimic_action_19
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_leo
    auto_transition: walk_leo
    key: [RB, Y]

  # Source virtual action 20: 左中鞭, 18000 iterations; RB+X
  - motion: supermimic_action_20
    period: 0.02
    runner:
      - name: rl_supermimic_runner
        enabled: true
        param_tag: rl_supermimic_action_20
    manual_transition:
      - passive
      - pd_stand
      - walk
      - walk_leo
    auto_transition: walk_leo
    key: [RB, X]

  - motion: supine_to_stance
    period: 0.02
    runner:
      - name: rl_dance_example_runner
        enabled: true
        param_tag: rl_supine_to_stance
    manual_transition:
      - passive
      - pd_stand
      - walk_leo
    auto_transition: walk_leo
    key: [START, CROSS_X_UP]

  - motion: prone_to_stance
    period: 0.02
    runner:
      - name: rl_supermimic_runner
        enabled: true
        param_tag: rl_prone_to_stance
    manual_transition:
      - passive
